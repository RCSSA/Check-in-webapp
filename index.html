<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCSSA Check-In Webapp</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
    <div class="container">
        <!-- Welcome Page -->
        <section id="welcome-section" class="full-screen-section">
            <div class="welcome-content">
                <h1 class="main-title">RCSSA Check-In Webapp</h1>
                <div class="input-group">
                    <label for="webapp-url">Enter AppScript Deployment Code:</label>
                    <input 
                        type="text" 
                        id="webapp-url" 
                        placeholder="https://script.google.com/macros/s/.../exec"
                        required
                    >
                    <button id="connect-btn" class="btn btn-primary">Connect</button>
                </div>
            </div>
        </section>

        <!-- QR Scanner Section -->
        <section id="scanner-section" class="full-screen-section" style="display: none;">
            <div class="scanner-content">
                <h2>📸 Scan QR Code</h2>
                <div id="scanner-container">
                    <div id="reader"></div>
                </div>
                <button id="stop-scan-btn" class="btn btn-secondary">Stop Scanner</button>
                <button id="change-sheet-btn" class="btn btn-link">Change Web App</button>
            </div>
        </section>

        <!-- Status Pages -->
        <section id="success-page" class="full-screen-section status-page status-success" style="display: none;">
            <div class="status-content">
                <div class="status-icon-large">✅</div>
                <h1>Check-In Success!</h1>
            </div>
        </section>

        <section id="already-checked-in-page" class="full-screen-section status-page status-warning" style="display: none;">
            <div class="status-content">
                <div class="status-icon-large">⚠️</div>
                <h1>Already Checked In</h1>
            </div>
        </section>

        <section id="not-found-page" class="full-screen-section status-page status-error" style="display: none;">
            <div class="status-content">
                <div class="status-icon-large">❌</div>
                <h1>Ticket Not Found</h1>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
